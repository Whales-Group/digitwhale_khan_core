name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add UEFI target
      run: rustup target add aarch64-unknown-uefi

    - name: Build
      run: cargo build --verbose

    - name: Run tests (native host)
      run: cargo test --verbose --target x86_64-unknown-linux-gnu
